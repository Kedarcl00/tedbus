<div class="community-feed">

  <!-- Header -->
  <div class="feed-header">
    <h2>{{ 'COMMUNITY.TITLE' | translate }}</h2>
    <button class="btn-primary" *ngIf="authService.currentUser" (click)="showForm = !showForm">
      <mat-icon>add</mat-icon>
      {{ 'COMMUNITY.NEW_POST' | translate }}
    </button>
  </div>

  <!-- Filter and Search Bar -->
  <div class="filter-search-bar" *ngIf="posts.length > 0">
    <select class="form-select" [(ngModel)]="filterTag" (ngModelChange)="onFilterChange()">
      <option value="">{{ 'COMMUNITY.FILTER_BY_TAG' | translate }}</option>
      <option *ngFor="let tag of availableTags" [value]="tag">#{{ tag }}</option>
    </select>
    <input class="form-input" type="search" [(ngModel)]="searchQuery" 
           (ngModelChange)="onSearchChange()"
           [placeholder]="'COMMUNITY.SEARCH_POSTS' | translate" />
    
    <!-- Sort Toggle -->
    <div class="sort-tabs">
      <button class="sort-tab" [class.active]="sortBy === 'recent'" (click)="setSortBy('recent')">
        Recent
      </button>
      <button class="sort-tab" [class.active]="sortBy === 'popular'" (click)="setSortBy('popular')">
        🔥 Popular
      </button>
    </div>
  </div>

  <!-- Error banner -->
  <div class="error-banner" *ngIf="error">{{ error }}</div>

  <!-- New post form -->
  <div class="post-form" *ngIf="showForm">
    <input class="form-input" [(ngModel)]="newTitle"
           [placeholder]="'COMMUNITY.POST_TITLE' | translate" />
    <textarea class="form-textarea" [(ngModel)]="newBody" rows="4"
              [placeholder]="'COMMUNITY.WRITE_POST' | translate"></textarea>
    <input class="form-input" [(ngModel)]="newTags"
           placeholder="Tags (comma-separated): route, destination, tip" />
    <input class="form-input" [(ngModel)]="newImageUrl"
           [placeholder]="'COMMUNITY.POST_IMAGE' | translate" />
    <select class="form-select" [(ngModel)]="selectedTopicId">
      <option value="">— Select a Topic (Optional) —</option>
      <option *ngFor="let t of topics" [value]="t._id">{{ t.title }}</option>
    </select>
    <div class="form-actions">
      <button class="btn-primary" [disabled]="submitting" (click)="submitPost()">
        {{ submitting ? 'Posting...' : ('COMMUNITY.SUBMIT' | translate) }}
      </button>
      <button class="btn-secondary" (click)="showForm = false">
        {{ 'COMMUNITY.CANCEL' | translate }}
      </button>
    </div>
  </div>

  <!-- Loading -->
  <div class="loading" *ngIf="isLoading">Loading posts…</div>

  <!-- Empty -->
  <div class="empty" *ngIf="!isLoading && filteredPosts.length === 0 && !error">
    {{ posts.length === 0 ? 'No posts yet. Be the first to share your travel story!' : 'No posts match your filters.' }}
  </div>

  <!-- Posts -->
  <ng-container *ngFor="let post of filteredPosts">
    <div class="post-wrapper">
      <div class="post-topic-badge" *ngIf="post.forumTopicId">
        {{ topicName(post.forumTopicId) }}
      </div>
      <app-post-card
        [post]="post"
        (like)="onLike($event)"
        (report)="onReport($event)"
        (delete)="onDelete($event)"
        (postUpdated)="onPostUpdated($event)">
      </app-post-card>
    </div>
  </ng-container>

</div>
