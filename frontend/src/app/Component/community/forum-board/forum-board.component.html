<div class="forum-board">

  <div class="board-header">
    <h2>{{ 'COMMUNITY.FORUM' | translate }}</h2>
    <button class="btn-primary" *ngIf="authService.currentUser" (click)="showTopicForm = !showTopicForm">
      <mat-icon>add</mat-icon> New Topic
    </button>
  </div>

  <div class="error-banner" *ngIf="error">{{ error }}</div>

  <!-- New topic form -->
  <div class="topic-form" *ngIf="showTopicForm">
    <input class="form-input" [(ngModel)]="newTopicTitle" placeholder="Topic title (e.g. Mumbai → Goa routes)" />
    <textarea class="form-textarea" [(ngModel)]="newTopicDesc" rows="2"
              placeholder="Brief description (optional)"></textarea>
    <div class="form-actions">
      <button class="btn-primary" [disabled]="submittingTopic" (click)="createTopic()">
        {{ submittingTopic ? 'Creating…' : 'Create Topic' }}
      </button>
      <button class="btn-secondary" (click)="showTopicForm = false">Cancel</button>
    </div>
  </div>

  <div class="board-layout">

    <!-- Topics sidebar -->
    <div class="topics-list">
      <div class="topics-title">Topics</div>
      <div *ngIf="isLoadingTopics" class="loading">Loading…</div>
      <div class="empty" *ngIf="!isLoadingTopics && topics.length === 0">No topics yet.</div>
      <div
        *ngFor="let topic of topics"
        class="topic-item"
        [class.active]="selectedTopic?._id === topic._id"
        (click)="selectTopic(topic)">
        <div class="topic-pin" *ngIf="topic.pinned">📌</div>
        <div class="topic-info">
          <div class="topic-name">{{ topic.title }}</div>
          <div class="topic-meta">{{ topic.postCount }} posts</div>
        </div>
      </div>
    </div>

    <!-- Posts panel -->
    <div class="posts-panel">
      <div *ngIf="!selectedTopic" class="empty">← Select a topic to view posts</div>

      <ng-container *ngIf="selectedTopic">
        <div class="topic-header">
          <h3>{{ selectedTopic.title }}</h3>
          <p *ngIf="selectedTopic.description">{{ selectedTopic.description }}</p>
        </div>

        <div class="loading" *ngIf="isLoadingPosts">Loading posts…</div>
        <div class="empty" *ngIf="!isLoadingPosts && posts.length === 0">
          No posts in this topic yet.
        </div>

        <app-post-card
          *ngFor="let post of posts"
          [post]="post"
          (like)="onLike($event)"
          (comment)="$event"
          (share)="onShare($event)"
          (report)="onReport($event)">
        </app-post-card>
      </ng-container>
    </div>
  </div>
</div>
