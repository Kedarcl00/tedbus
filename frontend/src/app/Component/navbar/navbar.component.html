<nav
  class="px-4 md:px-14 py-1 md:py-3 flex text-xs md:text-base font-normal items-center justify-between sticky top-0 z-20 drop-shadow-xl"
  style="background-color: var(--color-navbar-bg);">

  <!-- Left: logo + nav links -->
  <div class="flex gap-2 md:gap-16 items-center w-full justify-between md:w-auto md:justify-start">
    <div class="grid place-content-center">
      <img class="md:w-[4.5rem] md:h-auto w-12 h-10"
        src="assets/red-bus-with-word-bus-it_600323-482.avif" alt="Tedbus Logo">
    </div>
    <div class="h-6 w-[1px] bg-gray-200"></div>
    <div class="flex gap-3">
      <!-- Bus Tickets -->
      <a [routerLink]="['/my-trips']" 
         *ngIf="isloggedIn"
         routerLinkActive="active"
         class="flex flex-col items-center text-center gap-1 px-2 py-3 rounded-lg group hover:bg-gray-100 bg-main-color sm:bg-transparent"
         style="color: var(--color-text); cursor: pointer;"
         aria-label="My Trips"
         title="My Trips">
        <svg class="group-hover:fill-main-color fill-white sm:fill-black" width="29" height="20" viewBox="0 0 29 20">
          <path fill-rule="evenodd" clip-rule="evenodd" d="M27.4574 2.53544C26.7324 1.13025 25.8004 0.327283 24.7992 0.217787C15.4095 -0.712926 3.43064 1.49524 0.979642 3.88589C-0.090514 4.9261 -0.28038 7.3715 0.392782 11.3681C0.858818 14.1602 1.58376 16.6604 1.60102 16.7699L1.75637 17.3174L4.74245 16.9706C4.9841 18.6861 6.3822 20 8.07374 20C9.92062 20 11.4396 18.4123 11.4396 16.4414C11.4396 16.3501 11.4396 16.2771 11.4223 16.1859L18.4991 15.3282C18.4991 15.3464 18.4991 15.3829 18.4991 15.4012C18.4991 17.3539 20.0008 18.9598 21.8649 18.9598C23.7118 18.9598 25.2308 17.3721 25.2308 15.4012C25.2308 15.1092 25.1962 14.8172 25.1272 14.5435L28.1478 14.1785L28.3031 13.8317C29.5114 11.2039 29.0971 5.71082 27.4574 2.53544Z"/>
        </svg>
        <p style="color: var(--color-text)">{{ 'NAV.BUS_TICKETS' | translate }}</p>
      </a>
      <!-- Bus Tickets (not logged in - no link) -->
      <a *ngIf="!isloggedIn"
         class="flex flex-col items-center text-center gap-1 px-2 py-3 rounded-lg group hover:bg-gray-100 bg-main-color sm:bg-transparent"
         style="color: var(--color-text)">
        <svg class="group-hover:fill-main-color fill-white sm:fill-black" width="29" height="20" viewBox="0 0 29 20">
          <path fill-rule="evenodd" clip-rule="evenodd" d="M27.4574 2.53544C26.7324 1.13025 25.8004 0.327283 24.7992 0.217787C15.4095 -0.712926 3.43064 1.49524 0.979642 3.88589C-0.090514 4.9261 -0.28038 7.3715 0.392782 11.3681C0.858818 14.1602 1.58376 16.6604 1.60102 16.7699L1.75637 17.3174L4.74245 16.9706C4.9841 18.6861 6.3822 20 8.07374 20C9.92062 20 11.4396 18.4123 11.4396 16.4414C11.4396 16.3501 11.4396 16.2771 11.4223 16.1859L18.4991 15.3282C18.4991 15.3464 18.4991 15.3829 18.4991 15.4012C18.4991 17.3539 20.0008 18.9598 21.8649 18.9598C23.7118 18.9598 25.2308 17.3721 25.2308 15.4012C25.2308 15.1092 25.1962 14.8172 25.1272 14.5435L28.1478 14.1785L28.3031 13.8317C29.5114 11.2039 29.0971 5.71082 27.4574 2.53544Z"/>
        </svg>
        <p style="color: var(--color-text)">{{ 'NAV.BUS_TICKETS' | translate }}</p>
      </a>
      <!-- Route Planner -->
      <a [routerLink]="['/route-planner']"
         routerLinkActive="active"
         class="flex flex-col items-center text-center gap-1 px-2 py-3 rounded-lg group hover:bg-gray-100 sm:bg-transparent"
         style="color: var(--color-text); cursor: pointer;"
         aria-label="Route Planner"
         title="Route Planner">
        <mat-icon class="group-hover:text-red-500" style="color: var(--color-text)">map</mat-icon>
        <p style="color: var(--color-text)">Route Planner</p>
      </a>

      <!-- Community -->
      <a [routerLink]="['/community']"
         routerLinkActive="active"
         class="flex flex-col items-center text-center gap-1 px-2 py-3 rounded-lg group hover:bg-gray-100 sm:bg-transparent"
         style="color: var(--color-text); cursor: pointer;"
         title="Community">
        <mat-icon style="color: var(--color-text)">groups</mat-icon>
        <p style="color: var(--color-text)">Community</p>
      </a>
    </div>
  </div>

  <!-- Right: controls -->
  <div class="hidden md:flex items-center gap-2">

    <!-- Notification bell (logged in only) -->
    <button *ngIf="isloggedIn" 
            class="theme-toggle-btn notification-bell" 
            (click)="toggleNotificationDrawer()" 
            [title]="'NOTIFICATIONS.TITLE' | translate"
            [matBadge]="unreadCount"
            [matBadgeHidden]="unreadCount === 0"
            matBadgeSize="small"
            matBadgeColor="warn">
      <mat-icon style="color: var(--color-text)">notifications</mat-icon>
    </button>

    <!-- Language selector -->
    <button class="theme-toggle-btn" [matMenuTriggerFor]="langMenu" title="Language">
      <span style="font-size:18px">🌐</span>
      <span class="ml-1 text-sm" style="color: var(--color-text)">{{ currentLang.toUpperCase() }}</span>
    </button>
    <mat-menu #langMenu="matMenu">
      <button mat-menu-item *ngFor="let lang of languages" (click)="setLanguage(lang.code)">
        {{ lang.flag }} {{ lang.label }}
      </button>
    </mat-menu>

    <!-- Theme toggle -->
    <button class="theme-toggle-btn" (click)="toggleTheme()" [title]="isDark ? 'Switch to light mode' : 'Switch to dark mode'">
      <mat-icon style="color: var(--color-text)">{{ isDark ? 'light_mode' : 'dark_mode' }}</mat-icon>
    </button>

    <!-- Help -->
    <a class="flex items-center justify-center gap-2 h-10 px-2 rounded-lg hover:bg-gray-100"
       style="color: var(--color-text)">
      <i class="fa-solid fa-headset text-xl"></i>
      <p>{{ 'NAV.HELP' | translate }}</p>
    </a>

    <!-- Google sign-in (guest) -->
    <div id="google-btn" *ngIf="!isloggedIn"></div>

    <!-- Account menu (logged in) -->
    <ng-container *ngIf="isloggedIn">
      <button class="flex items-center justify-center gap-2 h-10 px-2 rounded-lg hover:bg-gray-100"
              [matMenuTriggerFor]="accountMenu" style="color: var(--color-text)">
        <i class="fa-regular fa-user text-xl"></i>
        <p>{{ 'NAV.ACCOUNT' | translate }}</p>
        <i class="fa-solid fa-angle-down text-xl"></i>
      </button>
      <mat-menu #accountMenu="matMenu">
        <button mat-menu-item (click)="navigate('/my-trips')">{{ 'NAV.MY_TRIPS' | translate }}</button>
        <button mat-menu-item (click)="navigate('/route-planner')">🗺️ Route Planner</button>
        <button mat-menu-item>{{ 'NAV.WALLET_CARDS' | translate }}</button>
        <button mat-menu-item (click)="navigate('/profile')">{{ 'NAV.MY_PROFILE' | translate }}</button>
        <button mat-menu-item>{{ 'NAV.WALLET' | translate }}</button>
        <button mat-menu-item (click)="handleLogout()">{{ 'NAV.SIGN_OUT' | translate }}</button>
      </mat-menu>
    </ng-container>
  </div>

  <!-- Notification Drawer -->
  <app-notification-drawer 
    [isOpen]="showNotificationDrawer" 
    (close)="showNotificationDrawer = false">
  </app-notification-drawer>
</nav>
